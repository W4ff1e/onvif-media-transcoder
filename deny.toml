# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = false

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Add advisory IDs here with a reason when a finding cannot be fixed yet.
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { crate = "openssl", reason = "the binary is fully static; use rustls if TLS is ever needed" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
