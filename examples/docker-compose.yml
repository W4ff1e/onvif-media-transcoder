# Run the published image. Copy examples/.env.example to .env, adjust it, then:
#   docker compose --env-file .env -f examples/docker-compose.yml up -d
#
# Host networking is used so WS-Discovery multicast reaches the NVR and so
# the advertised addresses are reachable. See the commented alternative
# below if host networking is not available.

services:
  onvif-media-transcoder:
    image: w4ff1e/onvif-media-transcoder:latest
    container_name: onvif-media-transcoder
    restart: unless-stopped
    network_mode: host
    environment:
      INPUT_URL: ${INPUT_URL:-https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8}
      RTSP_OUTPUT_PORT: ${RTSP_OUTPUT_PORT:-8554}
      RTSP_PATH: ${RTSP_PATH:-/stream}
      ONVIF_PORT: ${ONVIF_PORT:-8080}
      DEVICE_NAME: ${DEVICE_NAME:-ONVIF-Media-Transcoder}
      ONVIF_USERNAME: ${ONVIF_USERNAME:-admin}
      ONVIF_PASSWORD: ${ONVIF_PASSWORD:-onvif-rust}
      WS_DISCOVERY_ENABLED: ${WS_DISCOVERY_ENABLED:-true}
      RTSP_AUTH_ENABLED: ${RTSP_AUTH_ENABLED:-true}
      INPUT_CHECK: ${INPUT_CHECK:-warn}
      DEBUG_LOGGING: ${DEBUG_LOGGING:-false}
      # CONTAINER_IP: 192.168.1.50   # set explicitly if auto-detection picks the wrong interface
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:${ONVIF_PORT:-8080}/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"

# Alternative without host networking. WS-Discovery replies will carry the
# container's internal address unless CONTAINER_IP is set to the host's IP.
