name: Publish Docker image

# `unstable` is published after CI succeeds on main; `latest` and the
# semantic version tags are published when a GitHub release is published.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: w4ff1e/onvif-media-transcoder

jobs:
  publish:
    name: Build and push (amd64, arm64)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # For workflow_run, check out the commit CI actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=unstable,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=ONVIF Media Transcoder
            org.opencontainers.image.description=Exposes an HLS/RTSP stream as an ONVIF Profile S camera with WS-Discovery
            org.opencontainers.image.vendor=W4ff1e
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Primary tag for scanning
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unstable" >> "$GITHUB_OUTPUT"
          fi

  scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.publish.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  readme:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v7

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
          short-description: ONVIF Profile S camera front-end for HLS/RTSP streams, with WS-Discovery
